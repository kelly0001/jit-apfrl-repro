aggregation:
  alpha: 1.0
  async_launch_interval: 1.0
  base_network_time: 0.2
  base_train_time: 1.0
  beta: 1.0
  chi: 1.0
  eta_global: 0.05
  jit_budget_ms_per_episode: 10000.0
  jit_reference_ms_for_quality: 10000.0
  l_max_ms: 50.0
  network_time_jitter: 0.5
  normalize_dual_terms: true
  normalize_quality_terms: true
  staleness_scale: 20.0
  train_time_jitter: 0.3
data:
  dataset_path: ./data/processed/benchmark_v1.npz
  split: train
environment:
  action_levels:
  - 0.25
  - 0.5
  - 0.75
  - 1.0
  allocation_cost: 0.8
  allocation_fatigue: 0.03
  availability_persistence: 0.75
  backlog_cost: 1.5
  backlog_normalizer: 4.0
  base_service_ms: 18.0
  capacity_uncertainty: 0.01
  deadline_max_ms: 90.0
  deadline_min_ms: 35.0
  delay_uncertainty_ms: 1.0
  dispatch_overhead_ms: 3.0
  horizon: 200
  idle_recovery: 0.02
  initial_availability: 0.9
  initial_backlog: 0.1
  interference_strength: 0.2
  maximum_backlog: 4.0
  minimum_availability: 0.15
  minimum_congestion_factor: 0.55
  minimum_delay_ms: 1.0
  minimum_effective_capacity: 0.05
  minimum_task_work: 0.1
  num_nodes: 10
  physical_tardiness_cost: 0.0
  service_rate: 3.0
  shared_queue_coupling: 0.05
  state_dim: 14
  throughput_reward: 10.0
model:
  eta_noise: 0.25
  hidden_dim: 128
  mad_window: 5
privacy:
  episode_budget: 10.0
  epsilon_max: 0.2
  epsilon_min: 0.01
  mode: revised_coordinate
  rho_per_ms: 0.03
run:
  method: DP-FedRL
  seed: 5629
training:
  checkpoint_interval: 25
  clip_ratio: 0.2
  dual_clock_exponent: 0.6
  dual_step_size_initial: 0.01
  entropy_coefficient: 0.01
  federated_rounds: 400
  gae_lambda: 0.95
  gamma: 0.99
  learning_rate: 0.0003
  max_grad_norm: 0.5
  ppo_epochs: 4
  resume_from_checkpoint: false
  value_coefficient: 0.5
